<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brown Noise Machine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <!-- Hidden silent audio element to trick mobile OS into background playback -->
        <audio id="backgroundAudio" loop preload="auto" style="display: none;">
            <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
        </audio>
        <h1>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
            </svg>
            Noise Filter Generator
        </h1>

        <!-- 1. Power On/Off Toggle Button -->
        <div class="power-btn-container">
            <button id="powerBtn" class="power-btn" title="Toggle Noise">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1012.728 0M12 3v9" />
                </svg>
            </button>
        </div>

        <!-- 2. Mono / Stereo Mode Switch -->
        <div class="mode-switch-group">
            <span class="mode-label">Channel Mode</span>
            <div id="modeToggle" class="toggle-switch">
                <div class="toggle-slider"></div>
                <div id="monoOption" class="toggle-option active">Mono</div>
                <div id="stereoOption" class="toggle-option">Stereo</div>
            </div>
        </div>

        <!-- 3. Filter Cutoff Slider (0 to 750 Hz) -->
        <div class="control-group">
            <div class="label-row">
                <label for="filterSlider">Low-Pass Filter Cutoff</label>
                <span id="filterVal">750 Hz</span>
            </div>
            <input type="range" id="filterSlider" min="20" max="750" step="1" value="750">
        </div>

        <!-- 4. Fade Ramp Duration Slider (0 to 30 seconds) -->
        <div class="control-group">
            <div class="label-row">
                <label for="rampSlider">Fade Ramp Time</label>
                <span id="rampVal">1.0 s</span>
            </div>
            <input type="range" id="rampSlider" min="0" max="30" step="0.5" value="1.0">
        </div>

        <!-- 5. Volume Slider -->
        <div class="control-group">
            <div class="label-row">
                <label for="volumeSlider">Volume</label>
                <span id="volumeVal">-12 dB</span>
            </div>
            <input type="range" id="volumeSlider" min="-40" max="0" step="0.5" value="-12">
        </div>

        <!-- 6. Graphical Visualizer Display (Clickable to Toggle) -->
        <div id="visualizerContainer" class="visualizer-container" title="Click to toggle display">
            <canvas id="visualizer"></canvas>
            <div class="visualizer-overlay">Display Off (Click to Turn On)</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
